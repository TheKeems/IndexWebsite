<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>The Will of the City</title>
    <script src="prescripttext.js" defer></script>
    <link rel="icon" href="index.webp">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-rect"></div>
    <div class="container">
        <div id="home" class="tab-content active">
            <img class="fadeimg" 
                src="index.webp"
            >
            <h1 class="prescript header">Welcome, Proselyte</h1>
            <p class="prescript text">Select your preferred method of contacting your prescript device.</p>
            <div class="container-side">
                <button class="prescript button" onclick="switchTab('direct')">Direct Connection</button>
                <button class="prescript button" onclick="yourFunction()">Server Fetch</button>
            </div>
        </div>
        <div id="direct" class="tab-content">
            <h1 class="prescript header">Connect your device to your computer via cable</h1>
            <p class="prescript text">Press the button below to search for a connected device:</p>
            <div class="container-side">
                <button class="prescript button" onclick="yourFunction()">Begin connecting</button>
            </div>
            <button class="prescript button" onclick="switchTab('home')">Return</button>
        </div>
    </div>
</body>
</html>
